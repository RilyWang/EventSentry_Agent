name: CI

# 只跑「离线确定性」自检：状态机 13 条规则、证据权重、冲突检测、合规边界。
# 这些用例不依赖 LLM / iFinD / 外网，因此可在 CI 中稳定复现。
# 接口层与异常用例（需要服务在运行）在本地用 `python selftest.py` 全量执行。

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  selftest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offline rule self-test
        run: python selftest.py --rules
