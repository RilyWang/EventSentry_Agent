# Fly.io 部署配置 —— 免费额度内可跑，地址固定为 https://<app-name>.fly.dev
# 使用：
#   fly launch --no-deploy       # 首次，按提示创建 app
#   fly volumes create eventsentry_data --size 1   # 1GB 持久卷（存 SQLite）
#   fly secrets set LLM_API_KEY=... SERPER_API_KEY=...
#   fly deploy
app = "eventsentry"
primary_region = "hkg"          # 香港，国内访问较快

[build]
  dockerfile = "server/Dockerfile"

[env]
  PORT = "3000"
  DB_PATH = "/data/eventsentry.db"
  ENABLE_SCHEDULER = "1"
  SCHEDULER_RUN_ON_START = "0"

[[mounts]]
  source = "eventsentry_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"   # 空闲挂起，省额度
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 60
    soft_limit = 40

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
