version: "3.8"

# 本地一键起服务（数据库为 SQLite 文件，无需额外容器）。
# 线上部署见：render.yaml / fly.toml / railway.json（或 docs/09-deploy/PAAS_DEPLOY.md）。

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: eventsentry-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_PATH: /data/eventsentry.db
      ENABLE_SCHEDULER: "1"
    # 密钥不要写进 compose 文件：把 server/.env 挂载进去即可
    volumes:
      - ./server/.env:/app/.env:ro
      - eventsentry_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:3000/api/ping')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  eventsentry_data:
